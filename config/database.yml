default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  adapter: postgresql
  encoding: unicode
  database: myapp_development
  pool: 5
  username: postgres
  password: postgres
  host: db
  port: 5432

test:
  <<: *default
  database: myapp_test
  username: postgres
  password: postgres
  host: db
  port: 5432

production:
  <<: *default
  database: myapp_production
  username: postgres
  password: <%= ENV["DB_PASSWORD"] %>
  host: <%= ENV["DB_HOST"] %>