registry:
  username: 
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

service: mvp-1
image: chimitcyrenov/mvp-1_web

servers:
  web:
    hosts:
      - localhost
    cmd: bundle exec rails server -b 0.0.0.0
    healthcheck:
      path: /up
      port: 3000
      max_attempts: 10
      interval: 5s
      timeout: 10s
      max_ready_wait: 60s

hooks:
  pre-deploy:
    - "docker exec mvp-1-db-<hash> createdb -U postgres mvp_1_production || true"

accessories:
  db:
    image: postgres:16
    host: localhost
    env:
      clear:
        POSTGRES_DB: mvp_1_production
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    directories:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    host: localhost
    directories:
      - redis_data:/data

proxy:
  ssl: false
  host: localhost

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true
    RAILS_LOG_LEVEL: info
    REDIS_URL: redis://redis:6379/1 
    DATABASE_HOST: db
    DATABASE_USERNAME: postgres
    DATABASE_PASSWORD: postgres
    DATABASE_PORT: 5432

volumes:
  - "mvp-1_storage:/rails/storage"

builder:
  arch: amd64
  args:
    RAILS_MASTER_KEY: <%= ENV['RAILS_MASTER_KEY'] %>

ssh:
  user: and
  port: 22